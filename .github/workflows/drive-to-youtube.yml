name: Drive → YouTube 업로드

on:
  schedule:
    # 매시 7분(UTC). GitHub 스케줄은 5~30분 늦게 시작될 수 있음.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "업로드 없이 대상만 확인 (true/false)"
        type: boolean
        default: false
      max_uploads:
        description: "이번 실행 최대 업로드 수 (비우면 기본값)"
        type: string
        default: ""

# 실행이 겹쳐 같은 파일을 두 번 올리지 않도록 한 번에 하나만 실행
concurrency:
  group: drive-to-youtube
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # keepalive(스케줄 자동 비활성화 방지)용

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Upload new videos
        env:
          # --- secrets ---
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          CHAT_MENTIONS: ${{ vars.CHAT_MENTIONS }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID || vars.DRIVE_FOLDER_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID || vars.SHEET_ID }}
          DONE_FOLDER_ID: ${{ secrets.DONE_FOLDER_ID || vars.DONE_FOLDER_ID }}
          # --- variables (옵션, 비우면 기본값) ---
          SHEET_TAB: ${{ vars.SHEET_TAB }}
          YT_PRIVACY_STATUS: ${{ vars.YT_PRIVACY_STATUS }}
          YT_PUBLISH_SCHEDULE: ${{ vars.YT_PUBLISH_SCHEDULE }}
          YT_CATEGORY_ID: ${{ vars.YT_CATEGORY_ID }}
          YT_MADE_FOR_KIDS: ${{ vars.YT_MADE_FOR_KIDS }}
          YT_TITLE_TEMPLATE: ${{ vars.YT_TITLE_TEMPLATE }}
          YT_DESCRIPTION_TEMPLATE: ${{ vars.YT_DESCRIPTION_TEMPLATE }}
          YT_TAGS: ${{ vars.YT_TAGS }}
          REQUIRE_DESCRIPTION_FILE: ${{ vars.REQUIRE_DESCRIPTION_FILE }}
          YT_PLAYLIST_ID: ${{ vars.YT_PLAYLIST_ID }}
          YT_PLAYLIST_MAP: ${{ vars.YT_PLAYLIST_MAP }}
          MAX_UPLOADS_PER_RUN: ${{ inputs.max_uploads || vars.MAX_UPLOADS_PER_RUN }}
          MAX_ATTEMPTS: ${{ vars.MAX_ATTEMPTS }}
          MIN_FILE_AGE_MINUTES: ${{ vars.MIN_FILE_AGE_MINUTES }}
          AFTER_UPLOAD: ${{ vars.AFTER_UPLOAD }}
          INCLUDE_SUBFOLDERS: ${{ vars.INCLUDE_SUBFOLDERS }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python -m uploader.main

      # 공개 저장소는 60일간 활동이 없으면 스케줄이 자동으로 꺼진다.
      # 워크플로를 다시 enable 하면 그 타이머가 초기화된다. (비공개 저장소에선 영향 없음)
      - name: Keepalive
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/drive-to-youtube.yml/enable" --silent
