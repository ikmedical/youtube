name: 업로드 관리 시트 만들기 (최초 1회)

on:
  workflow_dispatch:
    inputs:
      parent_folder_id:
        description: "시트를 만들 공유 드라이브 폴더 ID (비우면 DRIVE_FOLDER_ID)"
        type: string
        default: ""
      sheet_name:
        description: "시트 파일 이름"
        type: string
        default: "YouTube 업로드 관리"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Create sheet
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          CHAT_MENTIONS: ${{ vars.CHAT_MENTIONS }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID || vars.DRIVE_FOLDER_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID || vars.SHEET_ID }}
          SHEET_TAB: ${{ vars.SHEET_TAB }}
          SHEET_PARENT_FOLDER_ID: ${{ inputs.parent_folder_id }}
          SHEET_NAME: ${{ inputs.sheet_name }}
        run: python -m uploader.setup_sheet
